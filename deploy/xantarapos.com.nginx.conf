server {
    listen 80;
    server_name xantarapos.com www.xantarapos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://xantarapos.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xantarapos.com www.xantarapos.com;
    client_max_body_size 4m;

    ssl_certificate /etc/letsencrypt/live/xantarapos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xantarapos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XantaraSSL:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/xantarapos.com.access.log;
    error_log /www/wwwlogs/xantarapos.com.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        alias /opt/xantarapos/media/;
        access_log off;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
